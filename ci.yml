name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          # Build does not call the APIs, but placeholders keep env checks predictable.
          SHOPAIKEY_API_KEY: test-key
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          BLOB_READ_WRITE_TOKEN: test-token
